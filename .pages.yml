# Pages CMS (https://pagescms.org) - the editor the team uses to add news, projects, resources and funding calls.
media:
  input: assets/uploads
  output: /assets/uploads

x-lang: &lang
  - { name: title, label: Pavadinimas / Title, type: string }
  - { name: text, label: Aprašymas / Description, type: text }

content:
  - name: news
    label: Naujienos / News
    type: collection
    path: content/news
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      fields: [lt.title, date, category]
      primary: lt.title
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: date, label: Data, type: date, required: true }
      - { name: time, label: "Laikas (nebūtina, pvz. 14:30; tos pačios dienos naujienoms rikiuoti)", type: string }
      - { name: pinned, label: "Rodyti pirmą sąraše (nuimkite varnelę, kai nebereikia)", type: boolean }
      - name: category
        label: Kategorija
        type: select
        options:
          values:
            - { value: news, label: Naujienos }
            - { value: events, label: Renginiai }
            - { value: projects, label: Projektai }
            - { value: funding, label: Finansavimas }
      - { name: image, label: Nuotrauka, type: image }
      - name: lt
        label: Lietuviškai
        type: object
        fields:
          - { name: title, label: Pavadinimas, type: string, required: true }
          - { name: summary, label: Santrauka, type: text }
          - { name: body, label: Tekstas, type: rich-text }
      - name: en
        label: English (leave empty if there is no English version)
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: summary, label: Summary, type: text }
          - { name: body, label: Text, type: rich-text }

  - name: resources
    label: Ištekliai / Resources
    type: file
    path: content/resources.json
    format: json
    fields:
      - name: items
        label: Ištekliai / Resources
        type: object
        list: true
        fields:
          - name: type
            label: Tipas / Type
            type: select
            options: { values: [publication, report, tool, course, collection, media] }
          - { name: language, label: Kalba / Language, type: select, options: { values: [lt, en] } }
          - { name: source, label: Autoriai ir metai arba šaltinis / Authors and year or source, type: string }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: *lang }
          - name: en
            label: English
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Description, type: text }
              - { name: url, label: "Link to the English version (optional, if different)", type: string }

      - name: platforms
        label: Europos platformos / European platforms
        type: object
        list: true
        fields:
          - { name: name, label: Pavadinimas / Name, type: string }
          - { name: logo, label: Logotipas / Logo, type: image }
          - { name: scope, label: Tipas, type: select, options: { values: [european, global] } }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: *lang }
          - { name: en, label: English, type: object, fields: *lang }

  - name: projects
    label: Projektai / Projects
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: items
        label: Mūsų projektai / Our projects
        type: object
        list: true
        fields:
          - { name: name, label: Pavadinimas / Name, type: string }
          - { name: logo, label: Logotipas / Logo, type: image }
          - { name: topic, label: Tema, type: select, options: { values: [nature, society, institutions, culture] } }
          - { name: scope, label: Tipas, type: select, options: { values: [national, international] } }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: [{ name: text, label: Aprašymas, type: text }] }
          - { name: en, label: English, type: object, fields: [{ name: name, label: Name (if different in English), type: string }, { name: url, label: Link (if different in English), type: string }, { name: text, label: Description, type: text }] }

  - name: initiatives
    label: Iniciatyvos / Initiatives
    type: file
    path: content/initiatives.json
    format: json
    fields:
      - name: items
        label: Iniciatyvos / Initiatives
        type: object
        list: true
        fields:
          - { name: name, label: Pavadinimas / Name, type: string }
          - { name: scope, label: Tipas, type: select, options: { values: [national, international] } }
          - { name: topic, label: Tema, type: select, options: { values: [nature, society, institutions, culture] } }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: [{ name: text, label: Aprašymas, type: text }] }
          - { name: en, label: English, type: object, fields: [{ name: text, label: Description, type: text }] }

  - name: services
    label: Paslaugos / Services
    type: file
    path: content/services.json
    format: json
    fields:
      - name: items
        label: Paslaugos / Services
        type: object
        list: true
        fields:
          - { name: example_url, label: Pavyzdžio nuoroda / Example link, type: string }
          - name: lt
            label: Lietuviškai
            type: object
            fields:
              - { name: title, label: Pavadinimas, type: string }
              - { name: text, label: Aprašymas, type: text }
              - { name: example, label: Pavyzdys, type: text }
          - name: en
            label: English
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Description, type: text }
              - { name: example, label: Example, type: text }

  - name: researchers
    label: Institucijos / Institutions
    type: file
    path: content/researchers.json
    format: json
    fields:
      - name: institutions
        label: Institucijos / Institutions
        type: object
        list: true
        fields:
          - { name: name, label: Institucija / Institution, type: string }
          - { name: logo, label: Logotipas / Logo, type: image }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: email, label: El. paštas / Email, type: string }
          - { name: phone, label: Telefonas / Phone, type: string }
          - name: lt
            label: Lietuviškai
            type: object
            fields:
              - { name: unit, label: Padalinys, type: string }
              - { name: text, label: Aprašymas, type: text }
          - name: en
            label: English
            type: object
            fields:
              - { name: unit, label: Unit, type: string }
              - { name: text, label: Description, type: text }
          - name: links
            label: Papildomos nuorodos / Extra links
            type: object
            list: true
            fields:
              - { name: url, label: Nuoroda / Link, type: string }
              - { name: lt, label: Pavadinimas lietuviškai, type: string }
              - { name: en, label: Title in English, type: string }

  - name: people
    label: Žmonės / People
    type: file
    path: content/about.json
    format: json
    fields:
      - name: people
        label: Žmonės / People
        type: object
        list: true
        fields:
          - { name: name, label: Vardas ir pavardė / Name, type: string }
          - { name: photo, label: Nuotrauka / Photo, type: image }
          - name: lt
            label: Lietuviškai
            type: object
            fields:
              - { name: role, label: Pareigos, type: string }
              - { name: bio, label: Aprašymas, type: text }
          - name: en
            label: English
            type: object
            fields:
              - { name: role, label: Role, type: string }
              - { name: bio, label: Description, type: text }
          - name: links
            label: Nuorodos / Links
            type: object
            list: true
            fields:
              - { name: label, label: Pavadinimas / Label, type: string }
              - { name: url, label: Nuoroda / Link, type: string }

  # Texts of the "Who wants to take part in research?" page. The numbers, table rows and labels
  # live in content/participation-data.json and are changed in code, not here.
  - name: participation
    label: Kas nori dalyvauti tyrimuose? / Who wants to take part in research?
    type: file
    path: content/participation.json
    format: json
    fields:
      - name: lt
        label: Lietuviškai
        type: object
        fields: &participation
          - { name: title, label: Pavadinimas / Title, type: string }
          - { name: intro, label: Įžanga / Intro, type: text }
          - { name: waffleTitle, label: Pirma antraštė / First heading, type: string }
          - { name: question, label: Tekstas virš langelių / Text above the squares, type: text }
          - { name: waffleNote, label: Pastaba po langeliais / Note under the squares, type: string }
          - { name: chartTitle, label: Diagramos pavadinimas / Chart title, type: string }
          - { name: chartNote, label: Pastaba po diagrama / Note under the chart, type: rich-text }
          - { name: compositionTitle, label: Antraštė "Trys iš keturių" / Heading "Three in four", type: string }
          - { name: compositionText, label: Tekstas / Text, type: text }
          - { name: profileTitle, label: Antraštė "Kas jie" / Heading "Who they are", type: string }
          - { name: profileText, label: Tekstas / Text, type: text }
          - { name: segmentsTitle, label: Segmentų antraštė / Segments heading, type: string }
          - name: segments
            label: Segmentų tekstai / Segment texts
            type: object
            list: true
            fields:
              - { name: id, label: "Segmentas (s1-s4) / Segment (s1-s4)", type: select, options: { values: [s1, s2, s3, s4] } }
              - { name: text, label: Tekstas / Text, type: text }
          - { name: practiceTitle, label: Antraštė "Planuojant projektą" / Heading "When you plan a project", type: string }
          - name: practice
            label: Kortelės / Cards
            type: object
            list: true
            fields:
              - { name: figure, label: Skaičius / Figure, type: string }
              - { name: title, label: Antraštė / Heading, type: string }
              - { name: text, label: Tekstas / Text, type: text }
          - { name: methodTitle, label: Antraštė "Apie duomenis" / Heading "About the data", type: string }
          - { name: method, label: Tekstas / Text, type: rich-text }
      - name: en
        label: English
        type: object
        fields: *participation

  - name: clinic
    label: Paraiškų penktadieniai / Proposal Fridays
    type: file
    path: content/clinic.json
    format: json
    fields:
      - { name: formUrl, label: Calendly nuoroda / Calendly link, type: string }
      - { name: photo, label: Nuotrauka / Photo, type: image }
      - name: lt
        label: Lietuviškai
        type: object
        fields: &clinic
          - { name: title, label: Pavadinimas / Title, type: string }
          - { name: intro, label: Įžanga / Intro, type: text }
          - { name: button, label: Mygtuko tekstas / Button text, type: string }
          - { name: eyebrow, label: Žyma virš pavadinimo / Label above the title, type: string }
          - { name: audience, label: Kam ir iki kada (po mygtuku) / For whom and until when (below the button), type: string }
          - { name: personName, label: Konsultantės vardas / Consultant name, type: string }
          - { name: personRole, label: Pareigos / Role, type: string }
          - { name: bubbles, label: Klausimai burbule (keičiasi vienas po kito) / Questions in the bubble (rotate), type: string, list: true }
          - { name: chips, label: Programų žymos / Programme chips, type: string, list: true }
          - { name: slot, label: Laiko žyma / Time chip, type: string }
          - { name: stepsTitle, label: Žingsnių antraštė / Steps heading, type: string }
          - name: steps
            label: Žingsniai / Steps
            type: object
            list: true
            fields:
              - { name: title, label: Pavadinimas / Title, type: string }
              - { name: text, label: Tekstas / Text, type: text }
          - { name: helpTitle, label: Antraštė "Kam labiausiai tinka" / Heading "Who it suits best", type: string }
          - { name: helpText, label: Įžanga / Lead, type: text }
          - { name: helpPoints, label: Kuo padedame (punktai) / What we help with (points), type: string, list: true }
          - { name: helpFocus, label: Kam labiausiai tinka / Who it suits best, type: text }
          - { name: helpProgLabel, label: Programų antraštė / Programmes label, type: string }
          - { name: help, label: Programos / Programmes, type: string, list: true }
          - { name: helpCalls, label: Nuoroda į kvietimų paiešką / Link to the calls database, type: rich-text }
          - { name: helpAfter, label: Tekstas po sąrašo / Text after the list, type: text }
          - { name: note, label: Pastaba / Note, type: text }
          - { name: statsTitle, label: Skaičių antraštė / Numbers heading, type: string }
          - name: stats
            label: Skaičiai / Numbers
            type: object
            list: true
            fields:
              - { name: fig, label: Skaičius / Number, type: string }
              - { name: text, label: Tekstas / Text, type: string }
          - { name: ctaTitle, label: Apatinės juostos antraštė / Bottom band heading, type: string }
      - name: en
        label: English
        type: object
        fields: *clinic

  - name: takepart
    label: Kaip prisidėti? / How to take part?
    type: file
    path: content/takepart.json
    format: json
    fields:
      - name: lt
        label: Lietuviškai
        type: object
        fields: &takepart
          - { name: title, label: Pavadinimas / Title, type: string }
          - { name: intro, label: Įžanga / Intro, type: text }
          - name: paths
            label: Trys keliai (gyventojams, tyrėjams, mokytojams; tvarkos nekeisti) / Three paths (residents, researchers, teachers; keep the order)
            type: object
            list: true
            fields:
              - { name: id, label: Nuorodos žymė (nekeisti) / Anchor (do not change), type: string }
              - { name: kicker, label: Kam / For whom, type: string }
              - { name: title, label: Kortelės antraštė / Card heading, type: string }
              - { name: text, label: Kortelės tekstas / Card text, type: text }
              - { name: heading, label: Skyriaus antraštė / Section heading, type: string }
              - { name: intro, label: Skyriaus įžanga / Section intro, type: text }
          - name: groups
            label: Gyventojams, grupės / For residents, groups
            type: object
            list: true
            fields:
              - { name: id, label: Nuorodos žymė (nekeisti) / Anchor (do not change), type: string }
              - { name: short, label: Trumpas pavadinimas mygtukui / Short name for the button, type: string }
              - { name: title, label: Antraštė / Heading, type: string }
              - { name: text, label: Tekstas / Text, type: text }
              - name: items
                label: Kortelės / Cards
                type: object
                list: true
                fields: &tpcard
                  - { name: when, label: Kada / When, type: string }
                  - { name: name, label: Pavadinimas / Name, type: string }
                  - { name: text, label: Aprašymas / Description, type: text }
                  - { name: how, label: Kaip pradėti / How to start, type: text }
                  - { name: url, label: Nuoroda / Link, type: string }
                  - { name: link, label: Nuorodos tekstas / Link text, type: string }
                  - { name: logo, label: "Logotipas (rodomas, jei nėra nuotraukos) / Logo (shown if there is no photo)", type: image }
                  - { name: img, label: "Nuotrauka (3:2) / Photo (3:2)", type: image }
                  - { name: alt, label: Ką rodo nuotrauka / What the photo shows, type: string }
                  - { name: credit, label: Nuotraukos autorius ir licencija / Photo credit and licence, type: string }
                  - { name: creditUrl, label: Nuotraukos šaltinis / Photo source link, type: string }
                  - { name: caseText, label: Pavyzdys / Example, type: text }
                  - { name: caseUrl, label: Pavyzdžio nuoroda / Example link, type: string }
                  - { name: caseLink, label: Pavyzdžio nuorodos tekstas / Example link text, type: string }
          - name: researchers
            label: Tyrėjams / For researchers
            type: object
            fields:
              - name: steps
                label: Žingsniai / Steps
                type: object
                list: true
                fields:
                  - { name: title, label: Pavadinimas / Title, type: string }
                  - { name: text, label: Tekstas / Text, type: text }
                  - name: links
                    label: Nuorodos / Links
                    type: object
                    list: true
                    fields:
                      - { name: text, label: Tekstas / Text, type: string }
                      - { name: url, label: Nuoroda / Link, type: string }
                      - { name: note, label: "Pastaba (pvz. formatas) / Note (e.g. format)", type: string }
          - name: teachers
            label: Mokytojams / For teachers
            type: object
            fields:
              - name: bands
                label: Klasių grupės / Grade bands
                type: object
                list: true
                fields:
                  - { name: title, label: Antraštė / Heading, type: string }
                  - { name: text, label: Tekstas / Text, type: text }
                  - name: items
                    label: Kortelės / Cards
                    type: object
                    list: true
                    fields: *tpcard
          - { name: ownTitle, label: Apatinės juostos antraštė / Bottom band heading, type: string }
          - { name: ownText, label: Apatinės juostos tekstas / Bottom band text, type: text }
      - name: en
        label: English
        type: object
        fields: *takepart

  - name: explainer
    label: Kas yra piliečių mokslas? / What is citizen science?
    type: file
    path: content/explainer.json
    format: json
    fields:
      - name: lt
        label: Lietuviškai
        type: object
        fields: &explainer
          - { name: title, label: Pavadinimas / Title, type: string }
          - { name: intro, label: Įžanga / Intro, type: text }
          - { name: shortTitle, label: Žyma virš apibrėžimo / Label above the definition, type: string }
          - { name: definition, label: Apibrėžimas / Definition, type: text }
          - { name: definitionSource, label: Apibrėžimo šaltinis / Definition source, type: string }
          - { name: simpleBig, label: Didelis sakinys / Big sentence, type: string }
          - { name: simple, label: Tekstas po juo / Text below, type: text }
          - { name: examplesTitle, label: Pavyzdžių antraštė / Examples heading, type: string }
          - name: examples
            label: Pavyzdžiai / Examples
            type: object
            list: true
            fields:
              - { name: tag, label: Žyma / Tag, type: string }
              - { name: title, label: Pavadinimas / Title, type: string }
              - { name: text, label: Tekstas / Text, type: text }
          - { name: whyTitle, label: Antraštė "Kodėl tai svarbu" / Heading "Why it matters", type: string }
          - name: why
            label: Kam svarbu / Who it matters for
            type: object
            list: true
            fields:
              - { name: who, label: Kam / For whom, type: string }
              - { name: text, label: Tekstas / Text, type: text }
          - { name: beyondTitle, label: Tamsios juostos antraštė / Dark band heading, type: string }
          - { name: beyondText, label: Tamsios juostos tekstas / Dark band text, type: text }
          - { name: startTitle, label: Antraštė "Nuo ko pradėti" / Heading "Where to start", type: string }
          - name: start
            label: Pradžios kortelės / Start cards
            type: object
            list: true
            fields:
              - { name: q, label: Klausimas / Question, type: string }
              - { name: text, label: Tekstas su nuorodomis / Text with links, type: rich-text }
      - name: en
        label: English
        type: object
        fields: *explainer
