# Pages CMS (https://pagescms.org) - the editor the team uses to add news, projects, resources and funding calls.
media:
  input: assets/uploads
  output: /assets/uploads

x-lang: &lang
  - { name: title, label: Pavadinimas / Title, type: string }
  - { name: text, label: Aprašymas / Description, type: text }

content:
  - name: news
    label: Naujienos / News
    type: collection
    path: content/news
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      fields: [lt.title, date, category]
      primary: lt.title
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: date, label: Data, type: date, required: true }
      - { name: time, label: "Laikas (nebūtina, pvz. 14:30; tos pačios dienos naujienoms rikiuoti)", type: string }
      - name: category
        label: Kategorija
        type: select
        options:
          values:
            - { value: news, label: Naujienos }
            - { value: events, label: Renginiai }
            - { value: projects, label: Projektai }
            - { value: funding, label: Finansavimas }
      - { name: image, label: Nuotrauka, type: image }
      - name: lt
        label: Lietuviškai
        type: object
        fields:
          - { name: title, label: Pavadinimas, type: string, required: true }
          - { name: summary, label: Santrauka, type: text }
          - { name: body, label: Tekstas, type: rich-text }
      - name: en
        label: English (leave empty if there is no English version)
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: summary, label: Summary, type: text }
          - { name: body, label: Text, type: rich-text }

  - name: resources
    label: Ištekliai / Resources
    type: file
    path: content/resources.json
    format: json
    fields:
      - name: items
        label: Ištekliai / Resources
        type: object
        list: true
        fields:
          - name: type
            label: Tipas / Type
            type: select
            options: { values: [publication, report, tool, course, collection, media] }
          - { name: language, label: Kalba / Language, type: select, options: { values: [lt, en] } }
          - { name: source, label: Autoriai ir metai arba šaltinis / Authors and year or source, type: string }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: *lang }
          - { name: en, label: English, type: object, fields: *lang }

      - name: platforms
        label: Europos platformos / European platforms
        type: object
        list: true
        fields:
          - { name: name, label: Pavadinimas / Name, type: string }
          - { name: logo, label: Logotipas / Logo, type: image }
          - { name: scope, label: Tipas, type: select, options: { values: [european, global] } }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: *lang }
          - { name: en, label: English, type: object, fields: *lang }

  - name: projects
    label: Projektai / Projects
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: items
        label: Mūsų projektai / Our projects
        type: object
        list: true
        fields:
          - { name: name, label: Pavadinimas / Name, type: string }
          - { name: logo, label: Logotipas / Logo, type: image }
          - { name: topic, label: Tema, type: select, options: { values: [nature, society, institutions, culture] } }
          - { name: scope, label: Tipas, type: select, options: { values: [national, international] } }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: [{ name: text, label: Aprašymas, type: text }] }
          - { name: en, label: English, type: object, fields: [{ name: name, label: Name (if different in English), type: string }, { name: url, label: Link (if different in English), type: string }, { name: text, label: Description, type: text }] }

  - name: initiatives
    label: Iniciatyvos / Initiatives
    type: file
    path: content/initiatives.json
    format: json
    fields:
      - name: items
        label: Iniciatyvos / Initiatives
        type: object
        list: true
        fields:
          - { name: name, label: Pavadinimas / Name, type: string }
          - { name: scope, label: Tipas, type: select, options: { values: [national, international] } }
          - { name: topic, label: Tema, type: select, options: { values: [nature, society, institutions, culture] } }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: lt, label: Lietuviškai, type: object, fields: [{ name: text, label: Aprašymas, type: text }] }
          - { name: en, label: English, type: object, fields: [{ name: text, label: Description, type: text }] }

  - name: services
    label: Paslaugos / Services
    type: file
    path: content/services.json
    format: json
    fields:
      - name: items
        label: Paslaugos / Services
        type: object
        list: true
        fields:
          - { name: example_url, label: Pavyzdžio nuoroda / Example link, type: string }
          - name: lt
            label: Lietuviškai
            type: object
            fields:
              - { name: title, label: Pavadinimas, type: string }
              - { name: text, label: Aprašymas, type: text }
              - { name: example, label: Pavyzdys, type: text }
          - name: en
            label: English
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Description, type: text }
              - { name: example, label: Example, type: text }

  - name: researchers
    label: Institucijos / Institutions
    type: file
    path: content/researchers.json
    format: json
    fields:
      - name: institutions
        label: Institucijos / Institutions
        type: object
        list: true
        fields:
          - { name: name, label: Institucija / Institution, type: string }
          - { name: logo, label: Logotipas / Logo, type: image }
          - { name: url, label: Nuoroda / Link, type: string }
          - { name: email, label: El. paštas / Email, type: string }
          - { name: phone, label: Telefonas / Phone, type: string }
          - name: lt
            label: Lietuviškai
            type: object
            fields:
              - { name: unit, label: Padalinys, type: string }
              - { name: text, label: Aprašymas, type: text }
          - name: en
            label: English
            type: object
            fields:
              - { name: unit, label: Unit, type: string }
              - { name: text, label: Description, type: text }
          - name: links
            label: Papildomos nuorodos / Extra links
            type: object
            list: true
            fields:
              - { name: url, label: Nuoroda / Link, type: string }
              - { name: lt, label: Pavadinimas lietuviškai, type: string }
              - { name: en, label: Title in English, type: string }

  - name: people
    label: Žmonės / People
    type: file
    path: content/about.json
    format: json
    fields:
      - name: people
        label: Žmonės / People
        type: object
        list: true
        fields:
          - { name: name, label: Vardas ir pavardė / Name, type: string }
          - { name: photo, label: Nuotrauka / Photo, type: image }
          - name: lt
            label: Lietuviškai
            type: object
            fields:
              - { name: role, label: Pareigos, type: string }
              - { name: bio, label: Aprašymas, type: text }
          - name: en
            label: English
            type: object
            fields:
              - { name: role, label: Role, type: string }
              - { name: bio, label: Description, type: text }
          - name: links
            label: Nuorodos / Links
            type: object
            list: true
            fields:
              - { name: label, label: Pavadinimas / Label, type: string }
              - { name: url, label: Nuoroda / Link, type: string }

  - name: explainer
    label: Kas yra piliečių mokslas? / What is citizen science?
    type: file
    path: content/explainer.json
    format: json
    fields:
      - name: lt
        label: Lietuviškai
        type: object
        fields:
          - { name: title, label: Pavadinimas, type: string }
          - { name: intro, label: Įžanga, type: text }
          - { name: body, label: Tekstas, type: rich-text }
      - name: en
        label: English
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: body, label: Text, type: rich-text }
